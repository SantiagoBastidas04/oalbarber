server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las redirecciones que genera nginx se devuelven relativas: el contenedor
    # escucha en 8080, pero el usuario entra por otro puerto (3000 por defecto).
    absolute_redirect off;

    # -------------------------------------------------------------------------
    # Compresión
    # -------------------------------------------------------------------------
    gzip on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Cabeceras de seguridad. Un `add_header` dentro de un `location` reemplaza
    # las del nivel superior, así que se repiten en los bloques que las añaden.
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Salud del contenedor
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -------------------------------------------------------------------------
    # API: se conserva el prefijo /api/. Con variables en `proxy_pass`, nginx
    # resuelve `api` en cada arranque; así el contenedor levanta aunque la API
    # todavía no esté disponible (responde 502 hasta que arranque).
    # -------------------------------------------------------------------------
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Recursos con hash en el nombre: caché larga.
    # -------------------------------------------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # El documento base nunca se cachea para que un despliegue se vea al instante.
    # -------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # -------------------------------------------------------------------------
    # Fotos estáticas del catálogo. La ruta de la SPA es /servicios (sin barra
    # final), así que este bloque solo atiende a los archivos de la carpeta:
    # si el archivo no existe devuelve 404 y NO cae al index.html.
    # -------------------------------------------------------------------------
    location /servicios/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # La ruta canónica de la SPA no lleva barra final.
    location = /servicios/ {
        return 301 /servicios;
    }

    # -------------------------------------------------------------------------
    # Fallback de la SPA: cualquier ruta del cliente devuelve index.html.
    # No se usa `$uri/` para que las carpetas no provoquen un 301 y la ruta
    # /servicios siempre llegue al router de React.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri /index.html;
    }
}
