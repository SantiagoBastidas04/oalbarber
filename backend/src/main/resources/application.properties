spring.application.name=oalbarber-api

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------------
# Configuración local (IDE / Maven) cuando se ejecuta fuera de Docker.
# Spring no lee .env por sí solo: se importa como propiedades si existe.
# En Docker este archivo no existe y las variables las inyecta Compose.
# ---------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------------------------
# Base de datos PostgreSQL (credenciales solo por variables de entorno)
# Acepta DB_* (Compose) o POSTGRES_* (archivo .env en local).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB}}
spring.datasource.username=${DB_USER:${POSTGRES_USER}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA e integridad del esquema
# El esquema lo controla Flyway: Hibernate solo valida y nunca lo modifica.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
spring.flyway.enabled=true

# ---------------------------------------------------------------------------
# Zona horaria America/Bogota (la JVM se configura con TZ en el contenedor)
# ---------------------------------------------------------------------------
spring.jackson.time-zone=America/Bogota

# ---------------------------------------------------------------------------
# Actuator: solo health e info expuestos
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Autenticación JWT (los valores llegan del .env a través de docker-compose)
# Si falta JWT_SECRETO, la API no arranca: preferimos fallar antes que correr
# sin la llave con la que se firma la sesión.
# ---------------------------------------------------------------------------
app.auth.jwt-secreto=${JWT_SECRETO}
app.auth.jwt-minutos-acceso=${JWT_MINUTOS_ACCESO:15}
app.auth.refresh-dias=${REFRESH_DIAS:7}

# ---------------------------------------------------------------------------
# Administrador inicial: se crea al arrancar si el celular no existe.
# Si ya existe, no se toca (ni rol ni contrasena).
# ---------------------------------------------------------------------------
app.admin.celular=${ADMIN_CELULAR:}
app.admin.nombre=${ADMIN_NOMBRE:OalBarber Admin}
app.admin.contrasena=${ADMIN_CONTRASENA:}
