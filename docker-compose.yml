name: oalbarber

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - oalbarber_net
    restart: unless-stopped
    # El puerto 5432 NO se publica al host por defecto: la API lo consume por la red interna.
    # Para inspeccionar la base con una herramienta de escritorio en desarrollo, descomenta:
    ports:
        - "5432:5432"

  api:
    container_name: apiOalBarber
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      TZ: America/Bogota
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oalbarber_net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oalbarber_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      # service_started, no healthy: nginx arranca aunque la API tarde y
      # devuelve 502 en /api/ hasta que esté disponible.
      api:
        condition: service_started
    networks:
      - oalbarber_net
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:

networks:
  oalbarber_net:
    driver: bridge
